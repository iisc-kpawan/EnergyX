[project]
name = "energyx-max"
version = "0.1.0"
description = "EnergyX-Max: generated building-energy analytics questions over BDG2, with program-computed answers"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.5",
    "numpy>=2",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6",
    "requests>=2.31",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "statsforecast>=2.0.1",
    "statsmodels>=0.14",
    "tslearn>=0.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["energyx_max"]

[tool.pytest.ini_options]
testpaths = ["tests"]
