[project]
name = "energyx-gold"
version = "0.1.0"
description = "Reference implementations and gold answers for the EnergyX-GOLD benchmark"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5,<2",
    "granite-tsfm>=0.2",
    "lightgbm>=4.5",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.11,<3",
    "pyoxigraph>=0.5,<0.6",
    "pyyaml>=6",
    "ruptures>=1.1",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "statsforecast>=2.0.1",
    "statsmodels>=0.14",
    "tslearn>=0.6",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["energyx_gold"]

[tool.pytest.ini_options]
testpaths = ["tests"]
